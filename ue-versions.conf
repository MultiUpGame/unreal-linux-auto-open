# Unreal Engine versions config
# Format: version = /full/path/to/binary
#
# Version is read from the "EngineAssociation" field in your .uproject file
# UE4 binary: UE4Editor
# UE5 binary: UnrealEditor

# 4.27 = /home/YOUR_USER/UE/UE4_27/UnrealEngine/Engine/Binaries/Linux/UE4Editor

# Custom/source builds use a GUID instead of a version number.
# Find the GUID in your .uproject file under "EngineAssociation".
# {0004A0B4-08DE-9DB4-BB53-F9B8850D3D35} = /home/YOUR_USER/UE/UE4_27/UnrealEngine/Engine/Binaries/Linux/UE4Editor

# More examples:
# 4.25 = /home/YOUR_USER/UE/UE4_25/UnrealEngine/Engine/Binaries/Linux/UE4Editor
# 4.26 = /home/YOUR_USER/UE/UE4_26/UnrealEngine/Engine/Binaries/Linux/UE4Editor
# 5.3  = /home/YOUR_USER/UE/UE5_3/UnrealEngine/Engine/Binaries/Linux/UnrealEditor
# 5.4  = /home/YOUR_USER/UE/UE5_4/UnrealEngine/Engine/Binaries/Linux/UnrealEditor
